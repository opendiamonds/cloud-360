services:
  db:
    image: postgres:15-alpine
    container_name: cloud360-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloud360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: cloud360-adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
