# Local-development helpers only: a Postgres a developer can reach with psql/GUI
# and Adminer. It deliberately publishes ports -- that is the point of it -- so
# the network segmentation and the resource/logging limits that the deploy and
# CI-test composes carry are deliberately NOT applied here.
#
# ⚠ The db image moved from postgres:15-alpine to PG 18 + pgvector, three major
# versions. PGDATA is not compatible across majors, and this file mounts the
# NAMED volume `postgres_data` with `restart: always`, so an existing volume puts
# the container into a restart loop. Nothing in CI covers this path. Remove the
# volume and recreate, or dump/restore first -- procedure in LOCAL-DEV.md §2.
#
# pgvector is not optional here: schema_rbac.sql's first statement is
# `CREATE EXTENSION IF NOT EXISTS vector` inside a single transaction, so a
# plain postgres image aborts the whole script and creates no tables at all.
services:
  db:
    image: pgvector/pgvector:pg18
    container_name: cloud360-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloud360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: cloud360-adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
