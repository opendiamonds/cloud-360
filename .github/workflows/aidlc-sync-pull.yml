name: AI-DLC Sync — 從 GitHub 拉回狀態

# ADR-0012 階段 2：Issues → repo 的反向同步。
#
# 只拉狀態（open/closed、assignee、labels），不碰內容——內容的真實來源是 repo。
#
# 一律開 PR，不直接推 ut。反向同步是唯一可能繞過 AI-DLC approval gate 的路徑，
# PR 化讓它必須經過人眼。
#
# 這是普通的 GitHub Actions，不是 gh-aw：同步是確定性邏輯（抓 API、比對、寫檔），
# 沒有需要判斷的地方。用 agent 跑只會更慢、更貴、更不可預測。

on:
  schedule:
    # 每 6 小時。狀態變更不急，而過於頻繁的 PR 會變成新的噪音來源。
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  # 不取消進行中的執行：它可能正在開 PR，中斷會留下半途的分支。
  group: aidlc-sync-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ut

      - name: 拉取 GitHub 狀態
        id: pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/aidlc_sync_pull.py --all-intents | tee /tmp/pull.log
          code=${PIPESTATUS[0]}
          set -e
          # 10 = 有狀態變更（見腳本的 main()）；0 = 無變更；其餘為真正的錯誤
          case "$code" in
            0)  echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            10) echo "changed=true"  >> "$GITHUB_OUTPUT" ;;
            *)  echo "同步失敗，退出碼 $code"; exit "$code" ;;
          esac

      - name: 開／更新 PR
        if: steps.pull.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 固定分支，不帶時間戳。
          #
          # 事故紀錄（2026-09-20 修）：原本這裡是 aidlc-sync/pull-<UTC 時間戳>，每次
          # 執行都開一個新分支、新 PR。但 PR 沒被合併時 ut 不會變，下一輪（每 6 小時）
          # 又偵測到同一筆差異，於是再開一個。從 09-06 上線到 09-19 累積了 53 個開著
          # 的 PR，其中 52 個是同一筆 state: open → closed 的重複，彼此只差 last_pulled
          # 的時間戳。
          #
          # 固定分支 ＋ force-push 讓已開的 PR 就地帶到最新內容：任何時刻最多一個
          # sync PR。ADR-0012 的「PR 不自動合併，人的決定權完整保留」不受影響——
          # 關卡還在，只是不再每 6 小時複製一份。
          branch="aidlc-sync/pull"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add 'aidlc/spaces/*/intents/*/github-status.md' \
                  'aidlc/spaces/*/intents/*/aidlc-sync-state.json'
          # commit 訊息寫進檔案再以 -F 帶入：heredoc 的結束標記必須頂格，
          # 而頂格會跳出 YAML 的 block scalar。
          # [aidlc-sync] 前綴讓正向同步的 workflow 排除這個 commit——防迴圈第 2 道
          {
            echo "整合(sync): [aidlc-sync] 從 GitHub 拉回 intent 狀態"
            echo
            sed -n '/項變更/,/^$/p' /tmp/pull.log | head -20
            echo
            echo "由 aidlc-sync-pull workflow 自動產生（ADR-0012 階段 2）。"
            echo "只含狀態鏡像與同步狀態，不含任何內容變更。"
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          # force：分支每輪都從 ut 的當下狀態重新長出來，舊 commit 沒有保留價值；
          # 且 ut 前進之後若不覆寫，這個分支會是無法快轉的舊基底。
          git push --force origin "HEAD:refs/heads/$branch"

          # force-push 已經把開著的 PR 帶到最新內容，不需要也不能重開一個。
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "已就地更新既有 PR #${existing}"
            exit 0
          fi

          gh pr create --base ut --head "$branch" \
            --title "整合(sync): 從 GitHub 拉回 intent 狀態" \
            --body-file .github/aidlc-sync-pr-body.md
