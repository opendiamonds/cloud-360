name: Deploy (ut → 192.168.10.10)

# Runs on the self-hosted runner that lives on 192.168.10.10. GitHub-hosted
# runners cannot reach a private LAN address, so the job goes to the machine
# instead of the machine being reachable from the job.

# Deploy only on a MERGED pull request into ut, never on a raw push. A merge is
# a reviewed change; a direct push is not, and this job runs commands on a
# machine on the private network. workflow_dispatch stays for manual redeploys.
on:
  pull_request:
    types: [closed]
    branches:
      - ut
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-10-10
  cancel-in-progress: false

jobs:
  deploy:
    name: docker compose up
    runs-on: [self-hosted, linux, x64, cloud360]
    timeout-minutes: 30
    # Consumed by the notify job, which runs on a GitHub-hosted runner so a
    # Slack message still goes out when this machine is the thing that broke.
    outputs:
      deployed: ${{ steps.sha.outputs.deployed }}
      subject: ${{ steps.sha.outputs.subject }}
      started: ${{ steps.sha.outputs.started }}
    # pull_request:closed fires on close-without-merge too; only a real merge
    # (or a manual dispatch) should deploy. Fork PRs must never reach this
    # self-hosted runner — see ADR-0007.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      # Check out the merge result on ut, not the PR head, so we deploy what
      # actually landed on the branch. Full history so rollback can revert.
      - uses: actions/checkout@v4
        with:
          ref: ut
          fetch-depth: 0

      # started is the clock the Slack message reports deploy duration against.
      # subject goes through the heredoc form because a commit title is
      # arbitrary text and would otherwise break the key=value line.
      - name: Record the commit being deployed
        id: sha
        run: |
          set -euo pipefail
          {
            echo "deployed=$(git rev-parse HEAD)"
            echo "started=$(date +%s)"
            echo "subject<<GH_OUTPUT_SUBJECT"
            git log -1 --pretty=%s
            echo "GH_OUTPUT_SUBJECT"
          } >> "$GITHUB_OUTPUT"

      # Fail loudly rather than deploying an insecure default. backend/services/
      # auth.py falls back to a hard-coded JWT signing key that is public in this
      # repository — anyone could mint an admin token against it. An empty
      # POSTGRES_PASSWORD likewise leaves postgres refusing to start, but hours
      # later and with a far more confusing error than this one.
      - name: Require the secrets that must not default
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${POSTGRES_PASSWORD}" ] || missing="${missing} POSTGRES_PASSWORD"
          [ -n "${JWT_SECRET}" ] || missing="${missing} JWT_SECRET"
          [ -n "${REDIS_PASSWORD}" ] || missing="${missing} REDIS_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "::error::Missing required repository secret(s):${missing}" >&2
            echo "JWT_SECRET signs every login token. Without it auth.py uses the" >&2
            echo "public fallback key and anyone can forge an admin session." >&2
            echo "REDIS_PASSWORD is the password of the Redis ACL user the app" >&2
            echo "connects as; empty means an ACL user with an empty password," >&2
            echo "which Redis accepts silently." >&2
            echo "Generate one with: openssl rand -hex 32" >&2
            exit 1
          fi

      # Rendered by deploy/render-env.sh so the deploy job and the rollback job
      # below cannot drift into deploying two different environments.
      - name: Write deploy/.env from secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # brain-infra (U1) adds SEVEN variables to deploy/.env, but only this
          # ONE goes through `env:`. The other six (REDIS_USER,
          # EMBEDDING_PROVIDER, REDIS_URL, OLLAMA_BASE_URL, OLLAMA_EMBED_MODEL,
          # FASTEMBED_MODEL) are literals inside render-env.sh. Adding them here
          # would map six names with no corresponding secret to the EMPTY
          # STRING -- and EMBEDDING_PROVIDER is required with no default, so the
          # backend would refuse to start, this job would go red, and the
          # rollback job plus a revert PR would fire on a good merge.
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CLOUD360_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.CLOUD360_BOOTSTRAP_ADMIN_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_USER: ${{ secrets.N8N_USER }}
          N8N_PASSWORD: ${{ secrets.N8N_PASSWORD }}
          APP_ENV: ${{ secrets.APP_ENV }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          COST_PRICING_USE_SDK: ${{ secrets.COST_PRICING_USE_SDK }}
          GCP_BILLING_API_KEY: ${{ secrets.GCP_BILLING_API_KEY }}
        run: bash deploy/render-env.sh

      - name: Build and start the stack
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.deploy.yml --env-file deploy/.env up -d --build --remove-orphans

      - name: Wait for the frontend to answer locally
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null --connect-timeout 5 --max-time 10 http://127.0.0.1:8090/; then
              echo "frontend up on 8090"
              exit 0
            fi
            sleep 5
          done
          echo "frontend did not come up on 8090" >&2
          docker compose -f deploy/docker-compose.deploy.yml --env-file deploy/.env ps
          docker compose -f deploy/docker-compose.deploy.yml --env-file deploy/.env logs --tail=80
          exit 1

      # The official ollama/ollama entrypoint is `ollama serve` and it pulls
      # NOTHING. Without this step /api/tags answers an empty list forever, the
      # ollama healthcheck stays green because an empty list is not an error,
      # the model cache volume stays empty, and every embedding call fails --
      # all of it silent.
      #
      # Runs INSIDE the container: the only service with a host port is
      # frontend, so the runner cannot reach ollama over HTTP. `exec -T` is
      # mandatory -- this runner has no TTY and `docker compose exec` without
      # it fails with "the input device is not a TTY".
      #
      # Placed after the frontend wait (so ollama has had time to come up) and
      # BEFORE the data-plane probe, so "the model is not ready" surfaces before
      # "the data plane is not connected". The two have no data dependency; the
      # order is fixed only to remove ambiguity.
      # ---------------------------------------------------------------------
      # Redis ACL reverse probe (review R-02, Major).
      #
      # WHY THIS EXISTS. The ACL is this unit's central new security control
      # (NFR4.1(b)/(c): the app must not connect as `default`, and `default` is
      # narrowed to +@connection). Before this step NOTHING verified it:
      #   * the two new unit tests assert render-env.sh string behaviour and the
      #     _ensure_vector_extension() call order -- neither touches the ACL;
      #   * validate_env_contract.py reads env vars only -- deleting the whole
      #     `--user` block does not turn it red;
      #   * the `redis-cli ping` healthcheck passes AS `default`, so it is
      #     orthogonal to whether the ACL took effect.
      #
      # THE FAILURE MODE IS SILENT. If redis-server de-duplicated the repeated
      # `--user` flag and kept only the last one, `default` would retain its
      # built-in FULL ACCESS, the app user would still be created, the container
      # would start and the healthcheck would go green -- a silent
      # over-permission. And per review R-01 no configured identity can run
      # `ACL LIST` (@admin @dangerous), so that state is undetectable at
      # runtime. This step is the only thing that makes it loud.
      #
      # Both assertions use commands that ARE reachable for the identity used:
      #   * `SET` as `default` must be refused (NOPERM) -- `default` holds only
      #     @connection.
      #   * `ACL WHOAMI` is @slow (not @dangerous), so the app user -- which has
      #     +@all -@admin -@dangerous -- can run it.
      # Together they exclude both "default was not narrowed" and "the app user
      # was never created".
      #
      # `docker inspect` additionally proves the OTHER two settings on the same
      # `command:` were at least PASSED to the server. It cannot prove the
      # server accepted them (CONFIG GET is @admin @dangerous, see R-01), but
      # since the ACL portion of that same argv demonstrably took effect, a
      # passed-but-rejected flag is not a live hypothesis.
      #
      # exec -T: no TTY on the self-hosted runner. Every value-taking command
      # runs in `if` condition position or with an explicit fallback, so none of
      # them aborts the step under `set -e`; the exit code is decided by the
      # assertions below, never by an intermediate command.
      - name: Verify the Redis ACL actually took effect
        run: |
          set -euo pipefail
          COMPOSE=(docker compose -f deploy/docker-compose.deploy.yml --env-file deploy/.env)
          # Read both values from deploy/.env, which render-env.sh just wrote.
          # Do NOT restate them here: REDIS_USER is a literal owned by
          # render-env.sh (NFR4.1(c) deliberately keeps it out of this
          # workflow's `env:`), and a second copy in this file would be a new
          # sync point nothing keeps aligned -- what team.md's
          # single-source-of-truth rule forbids.
          REDIS_USER="$(grep -E '^REDIS_USER=' deploy/.env | head -1 | cut -d= -f2-)"
          REDIS_PASSWORD="$(grep -E '^REDIS_PASSWORD=' deploy/.env | head -1 | cut -d= -f2-)"
          if [ -z "${REDIS_USER}" ] || [ -z "${REDIS_PASSWORD}" ]; then
            echo "::error::REDIS_USER or REDIS_PASSWORD is missing from deploy/.env, so the ACL cannot be verified. render-env.sh should have refused earlier -- investigate that step first." >&2
            exit 1
          fi

          # 1. `default` must be refused a data command.
          OUT="$("${COMPOSE[@]}" exec -T redis redis-cli set __acl_probe__ 1 2>&1 || true)"
          case "${OUT}" in
            *NOPERM*)
              echo "default is narrowed: SET refused with NOPERM" ;;
            *)
              echo "::error::Redis ACL did NOT take effect. As the default user, SET returned: ${OUT}. Expected a NOPERM refusal. The app would be running against a Redis whose default user still has full access (NFR4.1(b)/(c) silently failed open)." >&2
              "${COMPOSE[@]}" logs redis --tail=60 || true
              exit 1 ;;
          esac

          # 2. The app user must exist and be usable.
          WHO="$("${COMPOSE[@]}" exec -T redis redis-cli --user "${REDIS_USER}" --pass "${REDIS_PASSWORD}" --no-auth-warning acl whoami 2>&1 || true)"
          if [ "${WHO}" = "${REDIS_USER}" ]; then
            echo "app ACL user is usable: ACL WHOAMI returned ${WHO}"
          else
            echo "::error::the application Redis user is not usable. ACL WHOAMI returned: ${WHO} (expected ${REDIS_USER}). Every backend Redis call would fail with WRONGPASS or NOPERM." >&2
            "${COMPOSE[@]}" logs redis --tail=60 || true
            exit 1
          fi

          # 3. The other two settings on the same `command:` were passed.
          ARGS="$(docker inspect --format '{{json .Config.Cmd}}' "$("${COMPOSE[@]}" ps -q redis)" 2>/dev/null || echo '[]')"
          for FLAG in '--appendonly' '--maxmemory' '--maxmemory-policy'; do
            case "${ARGS}" in
              *"${FLAG}"*) ;;
              *)
                echo "::error::${FLAG} is absent from the running redis container argv: ${ARGS}. NFR4.2 (AOF) or the maxmemory relationship is not in effect." >&2
                exit 1 ;;
            esac
          done
          echo "appendonly / maxmemory / maxmemory-policy are all present in the running argv"

      - name: Pull the embedding model into the Ollama volume
        env:
          MODEL: bge-m3
        run: |
          set -euo pipefail
          COMPOSE=(docker compose -f deploy/docker-compose.deploy.yml --env-file deploy/.env)

          # `ollama pull` is NOT a no-op when the model is already present: it
          # still contacts the registry to compare the manifest, so a transient
          # registry outage fails it. Failing the deploy for that would turn a
          # good merge into an automatic rollback plus a revert PR while the
          # service is perfectly usable. So: decide by whether the model is
          # ALREADY in the volume, which /api/tags answers authoritatively.
          #
          # BOTH probe commands must take their value in a form `set -e` does
          # not abort on (assignment inside an `if` condition is exempt). A bare
          # `TAGS=$(...)` would end the step on the first non-zero exit and the
          # two-case decision below would never run -- inverting its meaning
          # into "any hiccup is a red deploy".
          TAGS=""
          if OUT=$("${COMPOSE[@]}" exec -T ollama ollama list 2>/dev/null); then
            TAGS="${OUT}"
          fi
          PRESENT=no
          case "${TAGS}" in
            *"${MODEL}"*) PRESENT=yes ;;
          esac
          echo "model already in volume: ${PRESENT}"

          if "${COMPOSE[@]}" exec -T ollama ollama pull "${MODEL}"; then
            echo "${MODEL} is present in the model volume"
          elif [ "${PRESENT}" = "yes" ]; then
            echo "::warning::ollama pull ${MODEL} failed, but the model is already in the volume (likely a transient registry outage). Continuing." >&2
          else
            echo "::error::ollama pull ${MODEL} failed and the model is NOT in the volume -- every embedding call would fail." >&2
            "${COMPOSE[@]}" logs ollama --tail=60 || true
            exit 1
          fi

      # The two curl checks around this one both request `/`, which
      # frontend/nginx.conf answers from `try_files` -- they never touch the
      # backend, let alone the database. `deploy.yml` had ZERO requests to /api
      # before this step existed, so a broken backend->db path deployed GREEN:
      # the home page served fine while every database-backed feature was dead.
      # This unit is what makes that reachable -- it moves `db` onto a separate
      # compose network.
      #
      # Why THIS endpoint and why 401 is the PASS (PROBE-CONTRACT P-1..P-3):
      #   * POST /api/auth/login hits nginx's `location /api/` and is proxied to
      #     the backend, so a 401 proves frontend->backend.
      #   * its handler queries Postgres for the username BEFORE comparing any
      #     password, so a 401 also proves backend->db.
      #   * the username is a fixed value that CANNOT exist, so the handler
      #     returns 401 before writing anything: no account, no audit row, and
      #     no secret needed by this step.
      # A 2xx would mean the probe is WRONG (it actually logged in), so testing
      # for 2xx would give a check that can never pass.
      #
      # Diagnostics, not pass conditions: a persistent 502 points at
      # backend->db (init_db runs in the startup event, so uvicorn never serves);
      # 500/504/timeout points at backend->redis or backend->ollama (not on the
      # startup path, so the app serves and fails mid-request); a 200 with HTML
      # means the request fell through to `try_files`, i.e. /api routing broke.
      - name: Probe the data plane through /api (frontend -> backend -> db)
        env:
          # Must not exist. A real account would reach the password comparison.
          PROBE_USERNAME: __cloud360_deploy_probe_no_such_user__
          # Bounded retry: the window exists to tell "backend is still running
          # init_db()" apart from "the data plane is actually severed", so it
          # must not be shortened just to make deploys finish sooner. nginx's
          # proxy_read_timeout is 600s, and cross-network isolation DROPs rather
          # than rejects, so without --max-time a single hung request would burn
          # ten minutes. Worst case here: 30 x (10 + 5) = 450s = 7.5 min, inside
          # this job's 30-minute budget.
          ATTEMPTS: "30"
          CONNECT_TIMEOUT: "5"
          MAX_TIME: "10"
        run: |
          set -euo pipefail
          CODE=000
          for _ in $(seq 1 "${ATTEMPTS}"); do
            # Assignment inside the `if` condition: `set -e` exempts it, so a
            # connection-layer failure (curl 7 / 28) does not abort the step.
            # `code=$(curl ...)` on its own line WOULD abort it -- that is
            # PROBE-CONTRACT P-5, and it has already been hit once in this repo.
            if OUT=$(curl -s -o /dev/null -w '%{http_code}' \
                  --connect-timeout "${CONNECT_TIMEOUT}" --max-time "${MAX_TIME}" \
                  -X POST http://127.0.0.1:8090/api/auth/login \
                  -H 'Content-Type: application/json' \
                  -d "{\"username\":\"${PROBE_USERNAME}\",\"password\":\"probe\"}"); then
              CODE="${OUT}"
            else
              CODE=000
            fi
            if [ "${CODE}" = "401" ]; then
              echo "data plane healthy: /api/auth/login answered 401"
              exit 0
            fi
            sleep 5
          done
          echo "::error::the data-plane probe never saw 401 (last HTTP ${CODE}). The site may still serve its home page while every database-backed feature is broken." >&2
          echo "502 throughout -> backend cannot reach db (check the networks: membership in deploy/docker-compose.deploy.yml)" >&2
          echo "500/504/000     -> backend cannot reach redis or ollama" >&2
          echo "200 with HTML   -> the request fell through to try_files; /api routing is broken" >&2
          docker compose -f deploy/docker-compose.deploy.yml --env-file deploy/.env ps
          docker compose -f deploy/docker-compose.deploy.yml --env-file deploy/.env logs --tail=80
          exit 1

      - name: Wait for the public hostname to answer through the tunnel
        run: |
          set -euo pipefail
          for _ in $(seq 1 24); do
            if curl -fsS -o /dev/null --connect-timeout 5 --max-time 10 https://cloud360.danniel.cc/; then
              echo "public: https://cloud360.danniel.cc"
              exit 0
            fi
            sleep 5
          done
          echo "tunnel did not serve cloud360.danniel.cc" >&2
          docker compose -f deploy/docker-compose.deploy.yml --env-file deploy/.env logs cloudflared --tail=60
          exit 1

      # Only reached when both health checks passed. This commit is now the
      # known-good the rollback job falls back to next time a deploy breaks.
      - name: Record this commit as the last-good deployment
        if: success()
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.cloud360"
          echo "${{ steps.sha.outputs.deployed }}" > "${HOME}/.cloud360/last-good-sha"

      - name: Remove the generated env file
        if: always()
        run: rm -f deploy/.env

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- commit: \`${{ steps.sha.outputs.deployed }}\`"
            echo "- public: https://cloud360.danniel.cc"
            echo "- internal: http://192.168.10.10:8090"
          } >> "$GITHUB_STEP_SUMMARY"

  # Self-healing: when the deploy job fails, restore the last-good version to
  # keep the site up, open a revert PR for the bad change, and hand the failure
  # to the Deploy Doctor agent for root-cause analysis. Runs only for a real
  # merged PR (a manual dispatch has no PR to revert).
  rollback:
    name: Roll back and diagnose
    needs: deploy
    if: >-
      failure() && needs.deploy.result == 'failure' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true
    runs-on: [self-hosted, linux, x64, cloud360]
    timeout-minutes: 20
    permissions:
      contents: write        # push the revert branch
      pull-requests: write   # open the revert PR
      actions: write         # dispatch the Deploy Doctor workflow
    outputs:
      restored: ${{ steps.restore.outputs.restored }}
      revert_pr: ${{ steps.revert.outputs.revert_pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ut
          fetch-depth: 0

      - name: Restore the last-good deployment
        id: restore
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Same one-variable rule as the deploy job above: only the credential
          # travels through `env:`; the other six brain-infra variables are
          # literals in render-env.sh. NOTE this job has no equivalent of the
          # deploy job's "Require the secrets that must not default" step, so
          # render-env.sh's own required-value check is the ONLY missing-value
          # guard on the rollback path.
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CLOUD360_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.CLOUD360_BOOTSTRAP_ADMIN_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_USER: ${{ secrets.N8N_USER }}
          N8N_PASSWORD: ${{ secrets.N8N_PASSWORD }}
          APP_ENV: ${{ secrets.APP_ENV }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          COST_PRICING_USE_SDK: ${{ secrets.COST_PRICING_USE_SDK }}
          GCP_BILLING_API_KEY: ${{ secrets.GCP_BILLING_API_KEY }}
          # Must not exist -- same fixed value and same reason as the deploy job.
          PROBE_USERNAME: __cloud360_deploy_probe_no_such_user__
          # FEWER attempts than the deploy side, on purpose. This job's budget is
          # 20 minutes (not 30) and it also contains an UNBOUNDED `up -d --build`
          # plus three `if: always()` steps afterwards. Each iteration now makes
          # TWO requests, so the worst case is 18 x (10 + 10 + 5) = 450s = 7.5
          # min -- the same ceiling as the deploy side, reached with fewer
          # attempts rather than by shortening per-request timeouts (shortening
          # those is what would cost the window its ability to tell "still
          # starting" from "actually severed"). Note this is MORE patient in wall
          # clock than the 30 x 5s = 150s loop it replaces.
          # ⚠ NOT MEASURED: `up -d --build` on the self-hosted runner is
          # unbounded and has not been timed. See DEPLOY.md item (9).
          ATTEMPTS: "18"
          CONNECT_TIMEOUT: "5"
          MAX_TIME: "10"
        run: |
          set -euo pipefail
          LAST=$(cat "${HOME}/.cloud360/last-good-sha" 2>/dev/null || true)
          if [ -z "${LAST}" ]; then
            echo "::warning::no last-good commit recorded — cannot roll back the running service" >&2
            echo "restored=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rolling the running stack back to ${LAST}"
          # Stage the renderer before checking out: the last-good commit may
          # predate it, and GitHub runs this workflow from the triggering ref
          # anyway, so the two must stay in step.
          cp deploy/render-env.sh "${RUNNER_TEMP}/render-env.sh"
          git checkout --quiet "${LAST}"
          bash "${RUNNER_TEMP}/render-env.sh" deploy/.env
          docker compose -f deploy/docker-compose.deploy.yml --env-file deploy/.env up -d --build --remove-orphans
          rm -f deploy/.env
          # Default to unhealthy and only upgrade on a passing health check: the
          # Slack message must not claim the site was restored when it never
          # came back up. Written once, so it does not rely on a later
          # $GITHUB_OUTPUT line overriding an earlier one.
          #
          # The data-plane probe is MERGED INTO this loop rather than added as a
          # separate step, and it expresses its result through RESTORED, never
          # through `exit`. Copying the deploy job's shape here breaks two
          # things: `exit 1` (or a `set -e` abort on the first connection
          # failure) skips the `echo "restored=..."` line below, `restored`
          # arrives empty, and the notify job's `case` falls through to
          # "回滾: 結果未知" -- the probe's real conclusion is lost.
          #
          # `/` and `/api/auth/login` must BOTH pass to call it healthy, and
          # "pass" means different things: 2xx for `/` (a static file via
          # try_files), 401 for the login probe (a fixed username that cannot
          # exist, so 401 is the proof that the backend is up AND can query the
          # database). Without the /api half, "rolled back and healthy on 8090"
          # says nothing about the data plane -- and rollback is the path a
          # failed probe takes, which is exactly when that matters most.
          #
          # No fourth status value is introduced: `notify` only understands
          # healthy / unhealthy / none, and adding one without amending its
          # `case` would degrade to "unknown", which is worse than coarse.
          RESTORED=unhealthy
          for _ in $(seq 1 "${ATTEMPTS}"); do
            if curl -fsS -o /dev/null \
                 --connect-timeout "${CONNECT_TIMEOUT}" --max-time "${MAX_TIME}" \
                 http://127.0.0.1:8090/; then
              # Assignment inside the `if` condition so `set -e` cannot end the
              # step here; that would skip the $GITHUB_OUTPUT write below.
              CODE=000
              if OUT=$(curl -s -o /dev/null -w '%{http_code}' \
                    --connect-timeout "${CONNECT_TIMEOUT}" --max-time "${MAX_TIME}" \
                    -X POST http://127.0.0.1:8090/api/auth/login \
                    -H 'Content-Type: application/json' \
                    -d "{\"username\":\"${PROBE_USERNAME}\",\"password\":\"probe\"}"); then
                CODE="${OUT}"
              fi
              if [ "${CODE}" = "401" ]; then
                echo "rolled back and healthy on 8090 (frontend 2xx + /api/auth/login 401)"
                RESTORED=healthy
                break
              fi
              echo "frontend answers but the data plane does not (HTTP ${CODE}); retrying"
            fi
            sleep 5
          done
          echo "restored=${RESTORED}" >> "$GITHUB_OUTPUT"

      - name: Capture the failing deploy log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Trim to the tail so it fits in a workflow_dispatch input.
          gh run view "${{ github.run_id }}" --log-failed 2>/dev/null | tail -c 8000 > /tmp/deploy-fail.log || true
          echo "captured $(wc -c < /tmp/deploy-fail.log) bytes of failure log"

      - name: Open a revert PR for the bad merge
        id: revert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          PR="${{ github.event.pull_request.number }}"
          BR="revert/deploy-fail-pr-${PR}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ut origin/ut
          git checkout -b "${BR}"
          if git revert -m 1 --no-edit "${MERGE_SHA}"; then
            # git revert writes an English "Revert ..." subject; rewrite it to the
            # Traditional-Chinese convention (ADR-0010). Amend rather than
            # --no-commit so the conflict path below stays exactly as it was.
            git commit --amend \
              -m "還原(deploy): 還原 PR #${PR}，部署至 192.168.10.10 失敗" \
              -m "自動還原。合併 #${PR} 觸發的部署失敗（run ${{ github.run_id }}），執行中的服務已回滾至上一個正常版本。合併本 PR 可讓 \`ut\` 與實際執行的版本一致。根因請見 Deploy Doctor 開的 issue。"
            git push origin "${BR}"
            # Capture the PR URL so the Slack message can link straight to it.
            # A create failure must not fail the job, so the URL may stay empty.
            PR_URL=$(gh pr create --base ut --head "${BR}" \
              --title "還原(deploy): 還原 PR #${PR}，部署至 192.168.10.10 失敗" \
              --body "自動還原。合併 #${PR} 觸發的部署失敗（run ${{ github.run_id }}），執行中的服務已回滾至上一個正常版本。合併本 PR 可讓 \`ut\` 與實際執行的版本一致。根因請見 Deploy Doctor 開的 issue。") \
              || echo "::warning::revert branch pushed but PR create failed"
            echo "revert_pr=${PR_URL:-}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::automatic revert hit a conflict; a human must revert PR #${PR} manually" >&2
            git revert --abort || true
            echo "revert_pr=" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the failure to the Deploy Doctor agent
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOG=$(cat /tmp/deploy-fail.log 2>/dev/null || true)
          gh workflow run deploy-doctor.lock.yml \
            -f run_id="${{ github.run_id }}" \
            -f pr_number="${{ github.event.pull_request.number }}" \
            -f failure_log="${LOG}" \
            || echo "::warning::could not dispatch Deploy Doctor"

  # Report every deploy outcome to Slack #nemoclaw. Deliberately on a
  # GitHub-hosted runner, not the self-hosted box: when 192.168.10.10 is the
  # thing that broke, the message still has to get out. This job must never
  # turn a healthy deploy red, so it does not gate anything and the send step
  # swallows Slack-side errors.
  notify:
    name: Notify Slack
    needs: [deploy, rollback]
    # always() so a failed deploy still reports; rollback is skipped on the
    # happy path and on manual dispatch, which is fine — needs tolerates it.
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the Slack token is configured
        id: slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN}" ]; then
            echo "::warning::SLACK_BOT_TOKEN is not set — skipping the Slack notification" >&2
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # jq builds the JSON so commit subjects and PR titles cannot break the
      # payload, and a JSON file sidesteps the stricter multiline-YAML parsing
      # that slack-github-action v4 introduced.
      - name: Compose the Slack payload
        if: steps.slack.outputs.configured == 'true'
        env:
          CHANNEL_ID: C0B5XEQDVR7
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ROLLBACK_RESULT: ${{ needs.rollback.result }}
          RESTORED: ${{ needs.rollback.outputs.restored }}
          REVERT_PR: ${{ needs.rollback.outputs.revert_pr }}
          DEPLOYED_SHA: ${{ needs.deploy.outputs.deployed }}
          COMMIT_SUBJECT: ${{ needs.deploy.outputs.subject }}
          STARTED: ${{ needs.deploy.outputs.started }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/pull
        run: |
          set -euo pipefail

          SHORT="${DEPLOYED_SHA:0:7}"
          [ -n "${SHORT}" ] || SHORT="(未知)"

          if [ -n "${STARTED}" ]; then
            ELAPSED=$(( $(date +%s) - STARTED ))
            DURATION="$(( ELAPSED / 60 )) 分 $(( ELAPSED % 60 )) 秒"
          else
            DURATION="未知"
          fi

          if [ -n "${PR_NUMBER}" ]; then
            PR_LINE="PR: <${PR_BASE_URL}/${PR_NUMBER}|#${PR_NUMBER}> ${PR_TITLE}（合併者 ${PR_MERGED_BY:-未知}）"
          else
            PR_LINE="觸發: 手動 workflow_dispatch"
          fi

          {
            case "${DEPLOY_RESULT}" in
              success)   echo "✅ *Cloud-360 部署成功*" ;;
              cancelled) echo "⚪ *Cloud-360 部署已取消*" ;;
              # <!here> is the Slack API form of @here; a literal "@here" in a
              # chat.postMessage body renders as plain text and pings nobody.
              *)         echo "<!here> ❌ *Cloud-360 部署失敗*" ;;
            esac
            echo ""
            echo "commit: \`${SHORT}\` ${COMMIT_SUBJECT:-}"
            echo "${PR_LINE}"
            echo "耗時: ${DURATION}"
            echo "run: <${RUN_URL}|GitHub Actions>"
            if [ "${DEPLOY_RESULT}" = "success" ]; then
              echo "公開: https://cloud360.danniel.cc"
              echo "內網: http://192.168.10.10:8090"
            fi
            if [ -n "${ROLLBACK_RESULT}" ] && [ "${ROLLBACK_RESULT}" != "skipped" ]; then
              echo ""
              case "${RESTORED}" in
                healthy)   echo "回滾: 已還原至上一個正常版本，服務健康" ;;
                unhealthy) echo "回滾: 已嘗試還原，但服務仍未恢復" ;;
                none)      echo "回滾: 沒有可用的 last-good 版本，未執行還原" ;;
                *)         echo "回滾: 結果未知（rollback job ${ROLLBACK_RESULT}）" ;;
              esac
              if [ -n "${REVERT_PR}" ]; then
                echo "Revert PR: <${REVERT_PR}|待合併>"
              else
                echo "Revert PR: 未建立（衝突或建立失敗），需人工處理"
              fi
              echo "Deploy Doctor: 已派工，根因分析請見新開的 issue"
            fi
          } > message.txt

          jq -Rs --arg channel "${CHANNEL_ID}" \
            '{channel: $channel, text: ., mrkdwn: true}' message.txt > payload.json
          echo "payload composed ($(wc -c < payload.json) bytes)"

      - name: Send the Slack message
        id: send
        if: steps.slack.outputs.configured == 'true'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: payload.json
          # Never fail this job on a Slack-side error: the deploy already
          # happened and its result must not be rewritten by a chat outage.
          errors: false

      # errors: false means Slack rejecting the message (not_in_channel,
      # invalid_auth) leaves the step green and silent, so a broken
      # notification would look identical to a working one forever. Surface the
      # verdict as a warning instead — visible in the run, still not a failure.
      - name: Report whether Slack accepted the message
        if: always() && steps.slack.outputs.configured == 'true'
        env:
          OK: ${{ steps.send.outputs.ok }}
          RESPONSE: ${{ steps.send.outputs.response }}
        run: |
          set -euo pipefail
          if [ "${OK}" = "true" ]; then
            echo "Slack accepted the message (ok=true)"
          else
            echo "::warning::Slack did not accept the deploy notification (ok=${OK:-unset}). Response: ${RESPONSE:-none}" >&2
            echo "not_in_channel → invite the bot to #nemoclaw; invalid_auth → check SLACK_BOT_TOKEN." >&2
          fi
