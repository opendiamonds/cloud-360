name: Brain health watch

# observability-setup（260920-orchestration-brain，[Q4]=C、[Q5]=A、[Q6]=B）。
#
# ---------------------------------------------------------------------------
# 為什麼要有它
# ---------------------------------------------------------------------------
# 上游 17 份 monitoring-design.md 把每一條告警的 Routes to 都寫成「無通道」
# （U10 的 OPEN-N10-4）。2026-11-15 staging 的大腦每一句都失敗（Jev 1.13 改為
# 決策模型，chat/completions 回 400），是使用者自己點開網站才發現的。本 workflow
# 是那條缺口的承載機制：每小時算一次計數，超過門檻就開或更新一則 GitHub issue，
# 並以既有的 SLACK_BOT_TOKEN 發一則 Slack。
#
# ---------------------------------------------------------------------------
# 三個 job，刻意互不依賴
# ---------------------------------------------------------------------------
# scan          在被監看的主機（self-hosted runner）上讀 backend 容器日誌——那是日誌
#               唯一的所在。
# site-probe    同樣在主機上，但經**公開網址**（Cloudflare Tunnel）打首頁與登入端點，
#               抓 tunnel／前端／資料庫壞掉。它原本跑在 GitHub 代管 runner 上，首次
#               驗證（run 43882387962）兩個端點都回 403——Cloudflare 擋下 GitHub 機房
#               的 IP，那是誤報（issue #725）。
# runner-watch  在 GitHub 代管 runner 上檢查**上一次** scan 有沒有真的被執行。主機或
#               runner 離線時，前兩個 job 會一直排隊或被新的一輪取代而取消，自己不會
#               失敗、也不會告警；這是唯一不依賴那台主機的眼睛。
# 三者各自管理一則 issue，故不以 needs 串接：串接會讓 GitHub 端的 job 等一個永遠不會
# 開始的 job。
#
# ---------------------------------------------------------------------------
# 公開 log 的紀律
# ---------------------------------------------------------------------------
# 本 repo 為 public、Actions log 與 issue 都公開可讀。日誌只寫到 RUNNER_TEMP，
# 從不 echo；對外只輸出計數、錯誤類別與門檻。後端日誌本身已經過欄位白名單
# （brain_gateway._log、intent_routing 的 RoutingObservation），不含對話內容。
#
# ---------------------------------------------------------------------------
# 無 LLM
# ---------------------------------------------------------------------------
# 純 .yml，不是 gh-aw。判斷是一組整數比較，放進 LLM 會落進 project.md 所說
# 「所有 LLM 路徑」那塊結構性盲區。

on:
  schedule:
    # 每小時第 17 分：避開整點的排程擁塞與 repo 內其他排程。
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # 開／更新／關閉告警 issue。先例：memory-retention-watchdog.yml（OPEN-ID9-2）。
  issues: write
  # runner-watch 讀本 workflow 的 run 與 job 狀態。先例：memory-retention-watchdog.yml。
  actions: read

jobs:
  scan:
    name: scan backend logs
    runs-on: [self-hosted, linux, x64, cloud360]
    timeout-minutes: 5
    # 主機恢復上線時，GitHub 只保留一個等待中的 run，不會一次補跑積壓的每一小時。
    concurrency:
      group: brain-health-scan
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BACKEND_CONTAINER: cloud360-backend-1
    steps:
      # actions/checkout 只為了取得本 repo 的 composite action；不讀任何程式。
      # 一定要 checkout 到獨立子目錄。self-hosted runner 上同一個 repo 的所有
      # workflow 共用同一個 $GITHUB_WORKSPACE；sparse checkout 留在那裡的
      # core.sparseCheckout=true 會讓 deploy.yml 之後的 checkout 只展開這一個
      # 目錄（deploy/render-env.sh 消失、exit 127；#750、#756）。
      - uses: actions/checkout@v4
        with:
          path: .brain-health-src
          sparse-checkout: .github/actions/brain-health-alert
          sparse-checkout-cone-mode: false

      - name: Collect backend logs (never printed)
        id: collect
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/brain-health"
          docker logs "${BACKEND_CONTAINER}" --since 1h   > "${RUNNER_TEMP}/brain-health/1h.log" 2>&1 || true
          docker logs "${BACKEND_CONTAINER}" --since 168h > "${RUNNER_TEMP}/brain-health/7d.log" 2>&1 || true
          state="$(docker inspect -f '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${BACKEND_CONTAINER}" 2>/dev/null || echo missing/none)"
          echo "container_state=${state}" >> "$GITHUB_OUTPUT"
          echo "backend container: ${state}"

      # 判斷邏輯只有這一步，backend/tests/test_brain_health_watch.py 把它抽出來，
      # 以假日誌實際執行（突變驗證見 observability-setup 的 alarms.md）。
      - name: Count events and decide
        id: decide
        env:
          LOG_1H: ${{ runner.temp }}/brain-health/1h.log
          LOG_7D: ${{ runner.temp }}/brain-health/7d.log
          CONTAINER_STATE: ${{ steps.collect.outputs.container_state }}
        run: |
          set -euo pipefail
          # grep -c 無命中時印 0 並以 1 結束；檔案不存在時什麼都不印——兩者都要回 0。
          count() { local n; n=$(grep -cE "$1" "$2" 2>/dev/null) || true; echo "${n:-0}"; }

          turns=$(count 'turn_end turnId=' "${LOG_1H}")
          turn_err=$(count 'turn_end turnId=.* outcome=error:' "${LOG_1H}")
          routed=$(count 'intent routing turn=' "${LOG_1H}")
          llm_down=$(count 'intent routing turn=.* error_kind=LlmUnavailable' "${LOG_1H}")
          malformed=$(count 'intent routing turn=.* error_kind=MalformedRouting' "${LOG_1H}")
          guard=$(count 'intent routing turn=.* error_kind=PROMPT_GUARD_HIT' "${LOG_1H}")
          mem_degraded=$(count 'intent routing turn=.* memory_degraded=True' "${LOG_1H}")
          turns_7d=$(count 'turn_end turnId=' "${LOG_7D}")
          turn_err_7d=$(count 'turn_end turnId=.* outcome=error:' "${LOG_7D}")

          alerts=""
          add() { alerts="${alerts:+${alerts} }$1"; }

          # A0 後端容器不在跑或健康檢查為 unhealthy。
          case "${CONTAINER_STATE}" in
            running/healthy|running/none|running/starting) ;;
            *) add BACKEND_DOWN ;;
          esac
          # A1 對話輪次錯誤率：1 小時內 > 5% 且至少 2 次（[Q6]=B 的告警門檻；
          #    至少 2 次是為了讓單一一次失敗在低流量時不成為 100% 而觸發）。
          if [ "${turn_err}" -ge 2 ] && [ $(( turn_err * 100 )) -gt $(( turns * 5 )) ]; then add TURN_ERRORS; fi
          # A2 路由層供應商不可用：1 小時內 LlmUnavailable > 5% 且至少 2 次
          #    （intent-router monitoring-design §二 寫 5 分鐘；本排程最小粒度為 1 小時，見 alarms.md）。
          if [ "${llm_down}" -ge 2 ] && [ $(( llm_down * 100 )) -gt $(( routed * 5 )) ]; then add LLM_UNAVAILABLE; fi
          # A3 schema／prompt 壞了：MalformedRouting 任何一次。
          if [ "${malformed}" -ge 1 ]; then add MALFORMED_ROUTING; fi
          # A4 記憶持續降級：1 小時內至少 3 輪降級。
          if [ "${mem_degraded}" -ge 3 ]; then add MEMORY_DEGRADED; fi
          # A5 prompt_guard 命中突增：1 小時內至少 5 次（日誌刻意不含 principal，無法按人計，見 alarms.md）。
          if [ "${guard}" -ge 5 ]; then add PROMPT_GUARD_SURGE; fi
          # S1 可用性 SLO：7 天滾動「非錯誤結束」≥ 99%；樣本至少 50 輪才判。
          if [ "${turns_7d}" -ge 50 ] && [ $(( turn_err_7d * 100 )) -gt "${turns_7d}" ]; then add SLO_7D_BREACH; fi

          if [ "${turns_7d}" -gt 0 ]; then
            avail_7d="$(awk -v e="${turn_err_7d}" -v t="${turns_7d}" 'BEGIN { printf "%.2f%%", (1 - e / t) * 100 }')"
          else
            avail_7d="無樣本"
          fi

          {
            echo "alerts=${alerts}"
            echo "turns=${turns}"
            echo "turn_err=${turn_err}"
            echo "routed=${routed}"
            echo "llm_down=${llm_down}"
            echo "malformed=${malformed}"
            echo "guard=${guard}"
            echo "mem_degraded=${mem_degraded}"
            echo "turns_7d=${turns_7d}"
            echo "turn_err_7d=${turn_err_7d}"
            echo "avail_7d=${avail_7d}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 大腦健康（過去 1 小時）"
            echo ""
            echo "| 項目 | 值 |"
            echo "|---|---|"
            echo "| 後端容器 | \`${CONTAINER_STATE}\` |"
            echo "| 對話輪次／錯誤結束 | ${turns} ／ ${turn_err} |"
            echo "| 路由次數／LlmUnavailable／MalformedRouting | ${routed} ／ ${llm_down} ／ ${malformed} |"
            echo "| 記憶降級輪次／prompt_guard 命中 | ${mem_degraded} ／ ${guard} |"
            echo "| 7 天可用性（SLO ≥ 99%） | ${avail_7d}（${turns_7d} 輪、錯誤 ${turn_err_7d}） |"
            echo "| 觸發中的告警 | \`${alerts:-無}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify
        id: notify
        uses: ./.brain-health-src/.github/actions/brain-health-alert
        with:
          title_prefix: "[brain-health] 大腦服務告警"
          alerts: ${{ steps.decide.outputs.alerts }}
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: C0B5XEQDVR7
          details: |
            過去 1 小時（計數，不含任何對話內容）：
            - 後端容器：`${{ steps.collect.outputs.container_state }}`
            - 對話輪次 ${{ steps.decide.outputs.turns }}，錯誤結束 ${{ steps.decide.outputs.turn_err }}（門檻：> 5% 且 ≥ 2）
            - 路由 ${{ steps.decide.outputs.routed }} 次；LlmUnavailable ${{ steps.decide.outputs.llm_down }}（> 5% 且 ≥ 2）；MalformedRouting ${{ steps.decide.outputs.malformed }}（≥ 1）
            - 記憶降級 ${{ steps.decide.outputs.mem_degraded }} 輪（≥ 3）；prompt_guard 命中 ${{ steps.decide.outputs.guard }}（≥ 5）
            - 7 天可用性 ${{ steps.decide.outputs.avail_7d }}（SLO ≥ 99%，樣本 ${{ steps.decide.outputs.turns_7d }} 輪，至少 50 輪才判）
          runbook: |
            **處置**（詳見 `aidlc/spaces/default/intents/260920-orchestration-brain/operation/observability-setup/alarms.md`）：
            1. `BACKEND_DOWN`：在 `192.168.10.10` 執行 `docker compose -f deploy/docker-compose.deploy.yml ps` 與 `logs --tail=80 backend`。
            2. `LLM_UNAVAILABLE`／`MALFORMED_ROUTING`：查 `log-queries.md` 的 Q2，對照 OpenRouter 狀態與 `BRAIN_ROUTER_MODEL`（ADR-0024）。
            3. `TURN_ERRORS`／`SLO_7D_BREACH`：查 Q1 依 `outcome=error:<code>` 分組。
            4. `MEMORY_DEGRADED`：查 memory 服務與 `memory_breaker_open`。
            5. `PROMPT_GUARD_SURGE`：安全事件，查 Q5；日誌不含觸發輸入。
            告警全部解除後，下一次檢查會自動留言並關閉本 issue。

      - name: Fail the run while an alert is firing
        if: steps.decide.outputs.alerts != ''
        env:
          ALERTS: ${{ steps.decide.outputs.alerts }}
        run: |
          echo "::error::大腦健康告警觸發中：${ALERTS}" >&2
          exit 1

  site-probe:
    name: probe the public URL
    # 在主機上、但經公開網址出去再進來：GitHub 代管 runner 的 IP 會被 Cloudflare 擋（403）。
    runs-on: [self-hosted, linux, x64, cloud360]
    timeout-minutes: 5
    concurrency:
      group: brain-health-site-probe
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SITE: https://cloud360.danniel.cc
      # 與 deploy.yml 的資料面探測同一個不存在的帳號：預期 401，2xx 代表探測本身錯了。
      PROBE_USERNAME: __cloud360_deploy_probe_no_such_user__
    steps:
      # 一定要 checkout 到獨立子目錄。self-hosted runner 上同一個 repo 的所有
      # workflow 共用同一個 $GITHUB_WORKSPACE；sparse checkout 留在那裡的
      # core.sparseCheckout=true 會讓 deploy.yml 之後的 checkout 只展開這一個
      # 目錄（deploy/render-env.sh 消失、exit 127；#750、#756）。
      - uses: actions/checkout@v4
        with:
          path: .brain-health-src
          sparse-checkout: .github/actions/brain-health-alert
          sparse-checkout-cone-mode: false

      - name: Probe the home page and the data plane
        id: probe
        run: |
          set -uo pipefail
          home=000; login=000
          for attempt in 1 2 3; do
            home=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "${SITE}/" || echo 000)
            login=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 \
              -X POST "${SITE}/api/auth/login" -H 'Content-Type: application/json' \
              -d "{\"username\":\"${PROBE_USERNAME}\",\"password\":\"probe\"}" || echo 000)
            if [ "${home}" = "200" ] && [ "${login}" = "401" ]; then break; fi
            sleep 20
          done
          alerts=""
          [ "${home}" = "200" ] || alerts="SITE_DOWN"
          [ "${login}" = "401" ] || alerts="${alerts:+${alerts} }DATA_PLANE_DOWN"
          echo "home=${home}" >> "$GITHUB_OUTPUT"
          echo "login=${login}" >> "$GITHUB_OUTPUT"
          echo "alerts=${alerts}" >> "$GITHUB_OUTPUT"
          echo "home=${home} login=${login} alerts=${alerts:-none}"

      - name: Notify
        uses: ./.brain-health-src/.github/actions/brain-health-alert
        with:
          title_prefix: "[brain-health] 網站從公開網址無法使用"
          alerts: ${{ steps.probe.outputs.alerts }}
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: C0B5XEQDVR7
          details: |
            從 staging 主機經公開網址（Cloudflare Tunnel）探測 `https://cloud360.danniel.cc`（重試 3 次）：
            - 首頁 HTTP ${{ steps.probe.outputs.home }}（預期 200）
            - `POST /api/auth/login` 以不存在的帳號 HTTP ${{ steps.probe.outputs.login }}（預期 401；資料庫相依功能是否可用）
          runbook: |
            **處置**：
            1. `SITE_DOWN`：Cloudflare Tunnel（`cloudflared` 容器）或 frontend 停了，或 Cloudflare 開始擋主機自己的 IP（看回應碼：403 多半是後者）。
            2. `DATA_PLANE_DOWN`（首頁正常）：後端或資料庫壞了，首頁仍可開但所有需資料庫的功能失效。
            告警全部解除後，下一次檢查會自動留言並關閉本 issue。

      - name: Fail the run while an alert is firing
        if: steps.probe.outputs.alerts != ''
        env:
          ALERTS: ${{ steps.probe.outputs.alerts }}
        run: |
          echo "::error::公開網址探測失敗：${ALERTS}" >&2
          exit 1

  runner-watch:
    name: watch the self-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: brain-health-runner-watch
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      WORKFLOW_FILE: brain-health-watch.yml
      SCAN_JOB_NAME: scan backend logs
      # 只看建立至少 50 分鐘前的那一輪：太新的一輪 scan 可能只是還在排隊。
      MIN_AGE_SECONDS: "3000"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/brain-health-alert
          sparse-checkout-cone-mode: false

      # 判斷邏輯只有這一步，backend/tests/test_brain_health_watch.py 以假的 gh 實際執行。
      - name: Decide whether the previous scan ever ran
        id: watch
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          now="$(date -u +%s)"
          if ! runs="$(gh run list --workflow "${WORKFLOW_FILE}" --event schedule --limit 10 \
                --json databaseId,createdAt 2>/dev/null)"; then
            # 本 workflow 尚未進入預設分支（main）時查不到任何 run：這不是主機離線，不告警。
            echo "state=unregistered" >> "$GITHUB_OUTPUT"
            echo "alerts=" >> "$GITHUB_OUTPUT"
            echo "previous=" >> "$GITHUB_OUTPUT"
            echo "scan=" >> "$GITHUB_OUTPUT"
            echo "::notice::查不到 ${WORKFLOW_FILE} 的排程 run（尚未進入預設分支？），本次不判斷。"
            exit 0
          fi
          prev="$(printf '%s' "${runs}" | jq -r --arg cur "${CURRENT_RUN_ID}" --argjson now "${now}" \
            --argjson min "${MIN_AGE_SECONDS}" \
            '[.[] | select((.databaseId | tostring) != $cur)
                  | select(($now - (.createdAt | fromdateiso8601)) >= $min)] | .[0].databaseId // empty')"
          if [ -z "${prev}" ]; then
            echo "state=no-previous" >> "$GITHUB_OUTPUT"
            echo "alerts=" >> "$GITHUB_OUTPUT"
            echo "previous=" >> "$GITHUB_OUTPUT"
            echo "scan=" >> "$GITHUB_OUTPUT"
            echo "還沒有夠舊的上一輪可判斷"
            exit 0
          fi
          scan="$(gh run view "${prev}" --json jobs 2>/dev/null \
            | jq -r --arg n "${SCAN_JOB_NAME}" \
                '[.jobs[] | select(.name == $n)] | .[0] | if . == null then "missing" else "\(.status)/\(.conclusion // "")" end')"
          [ -n "${scan}" ] || scan="missing"
          # scan 真的被 runner 執行過：completed 且結論為 success 或 failure（failure 代表它跑了、發現告警）。
          # 其他狀態——queued／waiting／pending、cancelled（被下一輪取代）、missing——代表 runner 沒有接手。
          case "${scan}" in
            completed/success|completed/failure) alerts="" ;;
            *) alerts="RUNNER_OFFLINE" ;;
          esac
          {
            echo "state=checked"
            echo "alerts=${alerts}"
            echo "previous=${prev}"
            echo "scan=${scan}"
          } >> "$GITHUB_OUTPUT"
          echo "previous run ${prev}: scan=${scan} alerts=${alerts:-none}"

      - name: Notify
        if: steps.watch.outputs.state == 'checked'
        uses: ./.github/actions/brain-health-alert
        with:
          title_prefix: "[brain-health] staging 主機或 runner 離線"
          alerts: ${{ steps.watch.outputs.alerts }}
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: C0B5XEQDVR7
          details: |
            上一輪排程（run ${{ steps.watch.outputs.previous }}）的 `scan` job 狀態：`${{ steps.watch.outputs.scan }}`（預期 `completed/success` 或 `completed/failure`）。
            排隊、被取消或不存在，代表 self-hosted runner 沒有接手——此時 `scan` 與 `site-probe` 都不會告警。
          runbook: |
            **處置**：
            1. 確認 `192.168.10.10` 開機、網路正常。
            2. 確認 runner 服務在跑（repo Settings → Actions → Runners，`cloud360-10-10` 應為 Idle／Active）。
            3. runner 恢復後，下一輪 scan 會補上日誌檢查；本 issue 在下一次判斷正常後自動關閉。

      - name: Fail the run while an alert is firing
        if: steps.watch.outputs.alerts != ''
        env:
          ALERTS: ${{ steps.watch.outputs.alerts }}
        run: |
          echo "::error::self-hosted runner 疑似離線：${ALERTS}" >&2
          exit 1
