allowlist_hosts:
  - pricing.us-east-1.amazonaws.com
  - cloudbilling.googleapis.com
  - prices.azure.com

aws:
  base_url: https://pricing.us-east-1.amazonaws.com
  index_url: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/index.json
  # AWS Price List Bulk API — 公開免帳號 JSON（參考 AWS offer v1.0 路徑）
  offer_path_template: /offers/v1.0/aws/{service_code}/current/{region}/index.json

gcp:
  base_url: https://cloudbilling.googleapis.com
  skus_path_template: /v1/services/{service_id}/skus
  max_pages: 20

azure:
  base_url: https://prices.azure.com
  prices_path: /api/retail/prices
  api_version: 2023-01-01-preview
  currency_code: USD

# 架構圖僅對到服務家族（如 AmazonEC2）時，用代表性規格查 On-Demand 單價。
# 非 Hrs 計費以 assumed_quantity 換算成等效 hourly（730h/月）供 C1 計算器使用。
default_products:
  AmazonEC2:
    product_family: Compute Instance
    instanceType: t3.micro
    operatingSystem: Linux
    tenancy: Shared
    preInstalledSw: NA
    capacitystatus: Used
  AmazonRDS:
    product_family: Database Instance
    instanceType: db.t3.micro
    databaseEngine: PostgreSQL
    deploymentOption: Single-AZ
  AWSELB:
    product_family: Load Balancer-Application
  AmazonElastiCache:
    product_family: Cache Instance
    instanceType: cache.t3.micro
    cacheEngine: Redis
  AmazonEFS:
    product_family: Storage
    storageClass: General Purpose
    assumed_quantity: 100
  AmazonS3:
    product_family: Storage
    storageClass: General Purpose
    volumeType: Standard
    assumed_quantity: 100
  AmazonRoute53:
    product_family: DNS Zone
    usagetype: HostedZone
    location_optional: true
  AWSWAF:
    product_family: Web Application Firewall
    assumed_quantity: 1000000
  AmazonCloudFront:
    product_family: Data Transfer
    location_optional: true
    assumed_quantity: 100
  AWSShield:
    product_family: Shield-DataTransfer
    location_optional: true
    assumed_quantity: 50
  AmazonECS:
    product_family: Compute
    usagetype_template: "{prefix}-Fargate-vCPU-Hours:perCPU"
  AmazonEKS:
    product_family: Compute
    usagetype_template: "{prefix}-AmazonEKS-Hours:perCluster"
  # 代表規格：每月 100 萬次呼叫（C1 示意；非真實工作負載）
  AWSLambda:
    product_family: Serverless
    group: AWS-Lambda-Requests
    assumed_quantity: 1000000
  # 代表規格：10 個自訂 metric／月
  AmazonCloudWatch:
    product_family: Metric
    usagetype: CW:MetricMonitorUsage
    assumed_quantity: 10
  # NAT Gateway 價目掛在 AmazonEC2；us-east-1 的 usagetype 無 USE1 前綴
  AmazonEC2NatGateway:
    service_code: AmazonEC2
    product_family: NAT Gateway
    usagetype_template: "{prefix}-NatGateway-Hours"
    usagetype_bare_prefixes: [USE1]
  # 代表規格：每月 100 萬次 HTTP API 請求（C1 示意）
  AmazonApiGateway:
    product_family: API Calls
    usagetype_template: "{prefix}-ApiGatewayHttpRequest"
    assumed_quantity: 1000000
  # 代表規格：1 DPU 持續 ETL（DPU-Hour ≈ Hrs）
  AWSGlue:
    product_family: AWS Glue
    usagetype_template: "{prefix}-ETL-DPU-Hour"
  # 代表規格：Notebook ml.t3.medium
  AmazonSageMaker:
    product_family: ML Instance
    usagetype_template: "{prefix}-Notebk:ml.t3.medium"
  # 代表規格：每月掃描 1 TB（C1 示意；非真實工作負載）
  AmazonAthena:
    product_family: Athena Queries
    usagetype_template: "{prefix}-DataScannedInTB"
    assumed_quantity: 1

